        <h1>Frankfurter Allgemeine</h1>
    </header>
    <main>
        <form name="add-news" method="POST" action="./skripta.php">
            <div>
                <label for="news-title">News title</label><br>
                <input type="text" id="news-title" name="news-title"><br>
            </div>
            <div>
                <label for="news-description-short">Short description</label><br>
                <textarea type="text" id="news-description-short" name="news-description-short" maxlength="50"></textarea><br>
            </div>
            <div>
                <label for="news-description">Description</label><br>
                <textarea type="text" id="news-description" name="news-description"></textarea><br>
            </div>
            <div>
                <label for="news-image-cover">Image:</label><br>
                <input type="file" id="news-image-cover" name="news-image-cover"><br>
            </div>
            <div>
                <select id="news-category" name="news-category">
                    <option value="Politik">Politik</option>
                    <option value="Sport">Sport</option>
                </select>
            </div>
            <div>
                <label for="news-archive">Add to archive:</label><br>
                <input type="checkbox" id="news-archive" name="news-archive" checked>
            </div>
            <div>
                <input type="reset" id="news-reset" name="news-reset" value="Poništi">
                <input type="submit" id="news-submit" name="news-submit" value="Prihvati"> 
            </div>
        </form>
    </main>
    <footer>
        <p>Frankfurter Allgemeine</p>
    </footer>
